<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MONOLITH — Strength Culture</title>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=DM+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
 --cream:#eae6d9;--dark:#17251d;--green:#315b43;
 --lime:#d5ed83;--orange:#d66b42;--grey:#9b9e91;
}
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--dark);font-family:'DM Sans',sans-serif}
a{text-decoration:none;color:inherit}
button{font:inherit;cursor:pointer}
nav{
 height:82px;padding:0 7%;display:flex;align-items:center;
 justify-content:space-between;background:var(--cream);
 position:sticky;top:0;z-index:100;border-bottom:1px solid #d1d0c4
}
.logo{font:38px Anton;letter-spacing:1px}
.logo span{color:var(--orange)}
.links{display:flex;align-items:center;gap:30px;font-size:12px;font-weight:800;letter-spacing:1px}
.links a:hover{color:var(--orange)}
.nav-cta{background:var(--dark);color:white;padding:14px 20px}
.menu{display:none;border:0;background:none;font-size:25px}
.hero{
 min-height:700px;padding:80px 7%;display:grid;
 grid-template-columns:1fr 1fr;gap:30px;align-items:center;
 position:relative;overflow:hidden
}
.hero-copy{position:relative;z-index:2}
.kicker{font-size:11px;font-weight:800;letter-spacing:4px;color:var(--orange);margin-bottom:25px}
h1{font:clamp(80px,12vw,160px)/.78 Anton;letter-spacing:-3px}
h1 span{color:var(--green);display:block}
.hero-copy p{font-size:15px;line-height:1.9;color:#666e62;max-width:410px;margin:30px 0}
.btn{
 display:inline-block;background:var(--dark);color:white;
 padding:17px 25px;font-size:11px;font-weight:800;letter-spacing:1px;
 transition:.3s;border:1px solid var(--dark)
}
.btn:hover{background:var(--orange);border-color:var(--orange);transform:translateY(-3px)}
.btn-light{background:transparent;color:var(--dark);margin-left:10px}
.hero-art{height:520px;position:relative;display:grid;place-items:center}
.arch{
 position:absolute;width:330px;height:470px;border:35px solid var(--green);
 border-bottom:0;border-radius:180px 180px 0 0;
 animation:arch 7s ease-in-out infinite
}
@keyframes arch{50%{transform:translateY(-15px) scale(.96)}}
.block{
 width:190px;height:250px;background:var(--orange);
 transform:rotate(-12deg);position:relative;z-index:2;
 box-shadow:25px 25px 0 var(--lime);
 animation:block 6s ease-in-out infinite
}
.block:before{
 content:"M";position:absolute;font:150px Anton;color:#fff;
 top:30px;left:35px;opacity:.9
}
@keyframes block{50%{transform:rotate(5deg) translateY(-18px)}}
.hero-number{position:absolute;bottom:30px;right:0;font:90px Anton;color:#d4d0c3}
.hero-sticker{
 position:absolute;top:45px;right:0;background:var(--lime);
 width:100px;height:100px;border-radius:50%;display:grid;
 place-items:center;text-align:center;font-size:10px;font-weight:900;
 transform:rotate(12deg);animation:spin 16s linear infinite
}
@keyframes spin{to{rotate:360deg}}
.marquee{background:var(--green);color:var(--cream);padding:19px 0;overflow:hidden;white-space:nowrap}
.marquee-inner{display:flex;width:max-content;animation:marquee 24s linear infinite}
.marquee span{font:30px Anton;letter-spacing:2px;margin:0 25px}
@keyframes marquee{to{transform:translateX(-50%)}}
.stats{
 padding:55px 7%;display:grid;grid-template-columns:repeat(4,1fr);
 gap:25px;border-bottom:1px solid #d1d0c4
}
.stat strong{font:55px Anton;color:var(--green)}
.stat p{font-size:11px;font-weight:800;letter-spacing:2px;color:#777b70;margin-top:7px}
section{padding:105px 7%}
.section-head{display:flex;justify-content:space-between;align-items:end;gap:25px;margin-bottom:45px}
.section-head h2{font:clamp(55px,8vw,100px)/.85 Anton}
.section-head p{max-width:350px;color:#72766b;font-size:14px;line-height:1.9}
.eyebrow{font-size:10px;font-weight:900;letter-spacing:3px;color:var(--orange);margin-bottom:18px}
.programs{display:grid;grid-template-columns:repeat(3,1fr);gap:15px}
.program{background:#dcd9cb;overflow:hidden;transition:.3s}
.program:hover{transform:translateY(-8px)}
.program-art{height:270px;position:relative;display:grid;place-items:center;overflow:hidden}
.p1{background:#b5c1a6}.p2{background:#d4a78d}.p3{background:#9ba9a0}
.art-shape{width:155px;height:155px;background:var(--green);border-radius:50%;position:relative}
.art-shape:after{content:"";position:absolute;width:105px;height:180px;border:12px solid var(--cream);left:25px;top:-12px;transform:rotate(35deg)}
.p2 .art-shape{background:var(--orange);border-radius:0;transform:rotate(45deg)}
.p2 .art-shape:after{transform:rotate(-80deg)}
.p3 .art-shape{background:var(--lime);clip-path:polygon(50% 0,100% 100%,0 100%);border-radius:0}
.p
